{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Genie</title>
<link rel="icon" href="{% static 'images/favicon.ico' %}">
<style>
    :root {
        --primary-color: #0078d7;
        --secondary-color: #f3f3f3;
        --text-color: #000;
        --card-bg: #fff;
        --card-border: #0078d7;
        --footer-bg: #0078d7;
        --footer-text: #fff;
        --transition-speed: 0.3s;
    }

    [data-theme="dark"] {
        --primary-color: #0078d7;
        --secondary-color: #1e1e1e;
        --text-color: #f0f0f0;
        --card-bg: #252526;
        --card-border: #0078d7;
        --footer-bg: #1e1e1e;
        --footer-text: #fff;
    }

    /* Reset */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body {
        display: flex;
        flex-direction: column;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--secondary-color);
        color: var(--text-color);
        transition: background-color var(--transition-speed), color var(--transition-speed);
        min-height: 100vh;
    }

    a { text-decoration:none; color:var(--primary-color); transition: all 0.2s ease; }
    a:hover { opacity:0.8; }

    /* Navbar */
    nav {
        background: var(--card-bg);
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        z-index:1000;
    }
    nav .nav-links a { margin:0 10px; font-weight:600; }
    nav .theme-toggle {
        cursor:pointer; padding:6px 12px; border-radius:5px;
        border:1px solid var(--primary-color);
        background:var(--primary-color); color:#fff; font-weight:bold;
        transition: all 0.2s ease;
    }
    nav .theme-toggle:hover { opacity:0.9; }

    /* Container */
    .container { max-width:1000px; flex:1; margin:30px auto; padding:0 20px; }

    /* Card */
    .card {
        background: var(--card-bg);
        border-left:5px solid var(--card-border);
        padding:20px; border-radius:8px;
        margin-bottom:20px;
        box-shadow:0 2px 6px rgba(0,0,0,0.05);
        transition: background var(--transition-speed), border-color var(--transition-speed);
    }

    /* Buttons */
    .btn {
        padding:10px 20px; border-radius:5px; border:none;
        font-weight:bold; cursor:pointer; color:#fff; margin-right:8px;
        transition: opacity 0.2s ease;
    }
    .btn:hover { opacity:0.85; }
    .btn-primary { background: var(--primary-color); }
    .btn-success { background: #28a745; }
    .btn-purple { background: #6f42c1; }
    .btn-warning { background: #ffc107; color:#000; }
    .btn-pdf { background:#6c757d; margin-top:10px; }

    /* Footer */
    footer {
        background: var(--footer-bg);
        color: var(--footer-text);
        text-align:center;
        padding:15px 10px;
        font-size:0.9rem;
    }

    /* Responsive */
    @media (max-width:768px){
        nav { flex-direction: column; align-items:flex-start; }
        nav .nav-links { margin-bottom:10px; }
        nav .nav-links a { margin:5px 0; }
    }
</style>
</head>
<body>

<nav>
    <div class="nav-links">
        <a href="{% url 'home' %}">🏠 Home</a>
        <a href="{% url 'explain' %}">📘 Explain</a>
        <a href="{% url 'summarize' %}">📘 Summarize</a>
        <a href="{% url 'quiz' %}">🧠 Quiz</a>
        <a href="{% url 'flashcards' %}">🃏 Flashcards</a>
    </div>
    <button class="theme-toggle" id="themeToggle">🌙 Dark Mode</button>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}

    {% if explanation or summary or quiz or flashcards %}
        <button class="btn btn-pdf" onclick="window.print()">💾 Save as PDF</button>
    {% endif %}
</div>

<footer>
    © 2026 Lakshya Kumar | Project: Study Genie | AI-Powered Study Assistant
</footer>

<script>
    // Theme toggle
    const toggleBtn = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    toggleBtn.innerText = savedTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    toggleBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const nextTheme = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nextTheme);
        localStorage.setItem('theme', nextTheme);
        toggleBtn.innerText = nextTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    });
</script>

</body>
</html>
